# Offline CI gate — lint + unit + scan via mise.
# Full e2e (LocalWP) is Local-only until Phase 9; see e2e-local.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: mise run ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise and tools
        uses: jdx/mise-action@v2

      - name: CI
        run: mise run ci
