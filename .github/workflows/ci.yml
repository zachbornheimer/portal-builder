# Offline CI gate — unit + mock facades only.
# Full e2e (LocalWP) is Local-only until Phase 9; see e2e-local.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: mocks + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: CI
        run: mise run ci
